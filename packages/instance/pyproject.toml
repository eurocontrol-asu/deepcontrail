[project]
name = "deepcontrail-instance"
version = "0.3.0"
description = "DeepContrail — instance segmentation of contrails: separate contrails in a segmentation map."
readme = "README.md"
requires-python = ">=3.11"
license = "EUPL-1.2"
license-files = ["LICENSE"]
authors = [{ name = "Amine Heffar" }]
maintainers = [
    { name = "EUROCONTROL Aviation Sustainability Unit", email = "github-asu@eurocontrol.int" },
]
keywords = ["contrails", "instance-segmentation", "remote-sensing", "satellite", "GOES"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "deepcontrail-core>=0.3,<0.4",
    "numpy>=1.24",
    "scipy>=1.10",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# COCO RLE masks (to_coco_results) and, with the evaluation, COCO mAP.
map = ["pycocotools>=2.0"]
# Training a ScoreModel (ScoreModel.fit). It reads the fitted trees from private scikit-learn
# attributes, so the upper bound is raised only after the exact-match test passes on a new version.
scores = ["scikit-learn>=1.3,<1.10"]

[project.urls]
Homepage = "https://github.com/eurocontrol-asu/deepcontrail"
Documentation = "https://github.com/eurocontrol-asu/deepcontrail/tree/main/packages/instance#readme"
Repository = "https://github.com/eurocontrol-asu/deepcontrail"
Issues = "https://github.com/eurocontrol-asu/deepcontrail/issues"
Changelog = "https://github.com/eurocontrol-asu/deepcontrail/blob/main/CHANGELOG.md"

[dependency-groups]
# optuna: only the tuning scripts run it (deepcontrail.instance._tuning imports it for types only).
dev = ["pytest>=7.4", "pyright>=1.1", "optuna>=4.0"]

[tool.uv.sources]
deepcontrail-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.10.2,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "deepcontrail.instance"
