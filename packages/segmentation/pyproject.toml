[project]
name = "deepcontrail-segmentation"
version = "0.1.0"
description = "DeepContrail — semantic segmentation of contrails in satellite imagery."
readme = "README.md"
requires-python = ">=3.11"
license = "EUPL-1.2"
license-files = ["LICENSE"]
authors = [{ name = "EUROCONTROL" }]
keywords = ["contrails", "segmentation", "remote-sensing", "deep-learning", "satellite", "GOES"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "deepcontrail-core>=0.1,<0.2",
    "numpy>=1.24",
    "pillow>=10.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "torch>=2.1",
    "torchvision>=0.16",
    "segmentation_models_pytorch>=0.4",
    "timm>=0.9",
    "pytorch-lightning>=2.1",
    "albumentations>=1.4",
]

[project.urls]
Repository = "https://github.com/eurocontrol-asu/deepcontrail"
"Bug Tracker" = "https://github.com/eurocontrol-asu/deepcontrail/issues"

[dependency-groups]
dev = ["pytest>=7.4", "pyright>=1.1"]

[tool.uv.sources]
deepcontrail-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.10.2,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "deepcontrail.segmentation"
