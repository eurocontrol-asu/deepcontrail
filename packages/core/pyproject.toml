[project]
name = "deepcontrail-core"
version = "0.1.0"
description = "DeepContrail core — torch-free dataset config, spectral bands, composites, splits and metrics."
readme = "README.md"
requires-python = ">=3.11"
license = "EUPL-1.2"
license-files = ["LICENSE"]
authors = [{ name = "EUROCONTROL" }]
keywords = ["contrails", "remote-sensing", "satellite", "GOES"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
deepcontrail-validate = "deepcontrail.core.validate:main"

[project.urls]
Repository = "https://github.com/eurocontrol-asu/deepcontrail"
"Bug Tracker" = "https://github.com/eurocontrol-asu/deepcontrail/issues"

[dependency-groups]
dev = ["pytest>=7.4", "pyright>=1.1"]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "deepcontrail.core"
