[project]
name = "deepcontrail"
version = "0.3.0"
description = "DeepContrail — contrail detection in satellite imagery: installs the whole library."
readme = "README.md"
requires-python = ">=3.11"
license = "EUPL-1.2"
license-files = ["LICENSE"]
authors = [{ name = "Amine Heffar" }]
maintainers = [
    { name = "EUROCONTROL Aviation Sustainability Unit", email = "github-asu@eurocontrol.int" },
]
keywords = ["contrails", "segmentation", "instance-segmentation", "remote-sensing", "satellite", "GOES"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
# No code of its own: it installs the library packages, released together with it.
dependencies = [
    "deepcontrail-core>=0.3,<0.4",
    "deepcontrail-segmentation>=0.3,<0.4",
    "deepcontrail-instance[map,scores]>=0.3,<0.4",
]

[project.urls]
Homepage = "https://github.com/eurocontrol-asu/deepcontrail"
Documentation = "https://github.com/eurocontrol-asu/deepcontrail#readme"
Repository = "https://github.com/eurocontrol-asu/deepcontrail"
Issues = "https://github.com/eurocontrol-asu/deepcontrail/issues"
Changelog = "https://github.com/eurocontrol-asu/deepcontrail/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=7.4"]

[tool.uv.sources]
deepcontrail-core = { workspace = true }
deepcontrail-segmentation = { workspace = true }
deepcontrail-instance = { workspace = true }

[build-system]
requires = ["uv_build>=0.10.2,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# No module: the package only depends on the others.
module-name = []
