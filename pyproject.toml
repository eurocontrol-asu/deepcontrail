# Development environment for the whole repository: the workspace root. Never built or
# published. The installable packages are the workspace members under packages/ and tools/.

[project]
name = "deepcontrail-workspace"
version = "0.1.0"
description = "DeepContrail development workspace (not published)."
requires-python = ">=3.11"
dependencies = ["deepcontrail-core", "deepcontrail-segmentation"]

[dependency-groups]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.1", "pyright>=1.1"]
# Imported only by the training/evaluation scripts, never by the library.
experiments = ["mlflow==3.17.0"]
# TensorFlow for the OpenContrails converter; opt-in with `uv sync --group convert`.
convert = ["deepcontrail-opencontrails"]

[tool.uv]
package = false
default-groups = ["dev", "experiments"]
# Pinned to the versions training runs on: newer lightning-utilities/torchmetrics broke
# Lightning's progress bar and changed metric behaviour. uv reads constraints only here,
# so they never reach the published packages.
constraint-dependencies = ["lightning-utilities==0.11.8", "torchmetrics==1.0.3"]

[tool.uv.sources]
deepcontrail-core = { workspace = true }
deepcontrail-segmentation = { workspace = true }
deepcontrail-opencontrails = { workspace = true }

[tool.uv.workspace]
members = ["packages/*", "tools/*"]

# ---------------------------------------------------------------------------
# Tooling (shared by every member)
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
# old_references/ is colleague reference code, not ours — keep it out of linting.
extend-exclude = ["old_references"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "ANN",    # flake8-annotations (enforce type hints — project is fully annotated)
    "D",      # pydocstyle (docstrings — NumPy convention)
    "PTH",    # flake8-use-pathlib
    "PT",     # flake8-pytest-style
    "TC",     # flake8-type-checking
    "NPY",    # numpy-asyncify / numpy 2.x compatibility
    "RUF",    # ruff-specific rules
]
ignore = [
    # NumPy-style docstrings: summary on the first line, Args:/Returns: blocks.
    "D203",  # one blank line before class docstring
    "D204",  # one blank line before method docstring
    "D213",  # multi-line summary on the second line (numpy wants the first line -> D212)
    "D402",  # first line should not be the function's signature
    "D417",  # missing argument descriptions (numpy documents params in the Args: block)
]

[tool.ruff.lint.isort]
known-first-party = ["deepcontrail"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["E501", "ANN001", "ANN201", "D103", "D104"]

[tool.pyright]
include = ["packages/core/src", "packages/segmentation/src", "tools/opencontrails/src"]
# old_references/ is colleague reference code, not ours — keep it out of type-checking.
exclude = ["old_references"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "packages/core/tests",
    "packages/segmentation/tests",
    "tools/opencontrails/tests",
]
# importlib mode: several packages have a tests/test_config.py.
addopts = "-ra --import-mode=importlib"

[tool.coverage.run]
branch = true
source = ["deepcontrail"]
