# Experiment configuration for DeepContrail semantic segmentation.
#
# Data splits: train (18,080), val (2,008), test (1,879 — holdout only).
# The data.split field sets the training split; val and test configs are
# derived automatically in scripts/train.py (no augmentation, same root).

data:
  root: /data/aheffar/projects/contrails/semanticseg
  split: train
  pixel_shift: 0.5
  seed: 42
  image_size: 224
  batch_size: 32
  num_workers: 8
  augmentation:
    horizontal_flip: 0.5
    vertical_flip: 0.5
    random_rotate_90: 0.5
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

model:
  architecture: UnetPlusPlus
  encoder_name: tu-coatnet_0_rw_224
  encoder_weights: imagenet
  in_channels: 3
  classes: 1
  decoder_attention_type: null
  decoder_use_norm: batchnorm

loss:
  name: dice
  smooth: 1.0
  from_logits: true

training:
  epochs: 100
  lr: 1.0e-4
  optimizer: AdamW
  scheduler: CosineAnnealingLR
  warmup_epochs: 5
  scheduler_interval: step
  weight_decay: 1.0e-4
  precision: bf16-mixed
  gradient_clip_val: 1.0
  early_stopping_patience: 10
