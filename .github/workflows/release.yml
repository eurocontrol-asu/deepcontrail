name: Release

# Publishing a GitHub release (tag vX.Y.Z) builds the five packages, publishes them to PyPI and
# attaches the files to the release. Running the workflow by hand publishes to TestPyPI instead,
# to rehearse a release. Both use PyPI trusted publishing: no token is stored in the repository.
#
# Each package is published from its own environment (pypi-<name>, testpypi-<name>): PyPI does
# not accept two pending trusted publishers with the same owner, repository, workflow and
# environment, so five packages from one repository need five environment names.
#
# One-time setup on pypi.org and test.pypi.org: add a (pending) trusted publisher with owner
# eurocontrol-asu, repository deepcontrail and workflow release.yml for each package:
# - deepcontrail-<name>, environment pypi-<name> (testpypi-<name>), for each <name> in core,
#   segmentation, instance and opencontrails;
# - deepcontrail (the code-free package that installs the library), environment
#   pypi-deepcontrail (testpypi-deepcontrail).
# PyPI accepts at most three pending publishers per account: register the others once the first
# projects exist, then re-run their failed jobs.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.7"
      # A release must carry the version of the packages (they are versioned in lockstep).
      - if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          for pyproject in packages/*/pyproject.toml tools/*/pyproject.toml; do
            version=$(sed -n 's/^version = "\(.*\)"$/\1/p' "$pyproject")
            if [ "v$version" != "$TAG" ]; then
              echo "$pyproject has version $version, but the release tag is $TAG"; exit 1
            fi
          done
      - run: uv build --all-packages
      # A deepcontrail/__init__.py in any wheel would shadow the other namespace packages.
      - run: |
          for wheel in dist/*.whl; do
            if unzip -l "$wheel" | grep -q " deepcontrail/__init__.py$"; then
              echo "$wheel ships deepcontrail/__init__.py"; exit 1
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish ${{ matrix.package == 'deepcontrail' && 'deepcontrail' || format('deepcontrail-{0}', matrix.package) }} to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    strategy:
      # One package failing (e.g. its trusted publisher is not registered yet) must not cancel
      # the others; re-run the failed job once it is fixed.
      fail-fast: false
      matrix:
        package: [deepcontrail, core, segmentation, instance, opencontrails]
    environment:
      name: pypi-${{ matrix.package }}
      url: https://pypi.org/project/${{ matrix.package == 'deepcontrail' && 'deepcontrail' || format('deepcontrail-{0}', matrix.package) }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - run: mkdir upload && mv dist/${{ matrix.package == 'deepcontrail' && 'deepcontrail-[0-9]*' || format('deepcontrail_{0}-*', matrix.package) }} upload/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: upload/

  testpypi:
    name: Publish ${{ matrix.package == 'deepcontrail' && 'deepcontrail' || format('deepcontrail-{0}', matrix.package) }} to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    strategy:
      # One package failing (e.g. its trusted publisher is not registered yet) must not cancel
      # the others; re-run the failed job once it is fixed.
      fail-fast: false
      matrix:
        package: [deepcontrail, core, segmentation, instance, opencontrails]
    environment:
      name: testpypi-${{ matrix.package }}
      url: https://test.pypi.org/project/${{ matrix.package == 'deepcontrail' && 'deepcontrail' || format('deepcontrail-{0}', matrix.package) }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - run: mkdir upload && mv dist/${{ matrix.package == 'deepcontrail' && 'deepcontrail-[0-9]*' || format('deepcontrail_{0}-*', matrix.package) }} upload/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: upload/

  attach:
    name: Attach files to the release
    if: github.event_name == 'release'
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
