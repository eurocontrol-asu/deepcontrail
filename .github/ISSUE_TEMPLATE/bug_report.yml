name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: input
    id: versions
    attributes:
      label: DeepContrail packages and versions
      description: Output of `pip list | grep deepcontrail` (or `uv pip list | grep deepcontrail`).
      placeholder: "deepcontrail-core 0.2.0, deepcontrail-segmentation 0.2.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Code or steps to reproduce the issue.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, GPU/CPU.
