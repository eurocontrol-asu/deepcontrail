[project]
name = "deepcontrail-opencontrails"
version = "0.1.0"
description = "Converter from the raw OpenContrails TFRecords to the DeepContrail dataset layout."
readme = "README.md"
requires-python = ">=3.11"
license = "EUPL-1.2"
license-files = ["LICENSE"]
authors = [{ name = "Amine Heffar" }]
maintainers = [
    { name = "EUROCONTROL Aviation Sustainability Unit", email = "github-asu@eurocontrol.int" },
]
keywords = ["contrails", "OpenContrails", "GOES", "remote-sensing", "satellite", "dataset"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "deepcontrail-core>=0.1,<0.2",
    "numpy>=1.24",
    "pillow>=10.0",
    # The lock holds the tested version; pip users get any 2.x from it on.
    "tensorflow>=2.21,<3",
]

[project.scripts]
deepcontrail-convert-opencontrails = "deepcontrail.opencontrails.convert:main"

[project.urls]
Homepage = "https://github.com/eurocontrol-asu/deepcontrail"
Documentation = "https://github.com/eurocontrol-asu/deepcontrail/tree/main/tools/opencontrails#readme"
Repository = "https://github.com/eurocontrol-asu/deepcontrail"
Issues = "https://github.com/eurocontrol-asu/deepcontrail/issues"
Changelog = "https://github.com/eurocontrol-asu/deepcontrail/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=7.4", "pyright>=1.1"]

[tool.uv.sources]
deepcontrail-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.10.2,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "deepcontrail.opencontrails"
