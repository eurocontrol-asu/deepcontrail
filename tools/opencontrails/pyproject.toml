[project]
name = "deepcontrail-opencontrails"
version = "0.1.0"
description = "Converter from the raw OpenContrails TFRecords to the DeepContrail dataset layout."
readme = "README.md"
requires-python = ">=3.11"
license = "EUPL-1.2"
license-files = ["LICENSE"]
authors = [{ name = "EUROCONTROL" }]
dependencies = [
    "deepcontrail-core>=0.1,<0.2",
    "numpy>=1.24",
    "pillow>=10.0",
    "tensorflow==2.21.0",
]

[project.scripts]
deepcontrail-convert-opencontrails = "deepcontrail.opencontrails.convert:main"

[dependency-groups]
dev = ["pytest>=7.4", "pyright>=1.1"]

[tool.uv.sources]
deepcontrail-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "deepcontrail.opencontrails"
